[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-drafter-cli"
version = "0.1.0"
description = "Draft truthful marketplace listing copy (title + honest description + condition check) from item notes. Optional rewrite pass via a local, key-free OpenAI-compatible endpoint."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["reselling", "ebay", "marketplace", "listing", "drafting", "local-ai", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = []

[project.scripts]
listing-drafter = "listing_drafter.cli:run"

[project.urls]
Homepage = "https://dylanasdale.github.io"

[tool.setuptools]
packages = ["listing_drafter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
